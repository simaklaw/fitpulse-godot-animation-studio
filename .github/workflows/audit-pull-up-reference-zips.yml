name: Audit Uploaded Pull-Up Reference ZIPs

on:
  push:
    branches:
      - audit/pull-up-reference-zips
    paths:
      - ".github/workflows/audit-pull-up-reference-zips.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install safe image preview dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Inspect ZIPs, extract safe files, and build contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, mimetypes, os, zipfile
          from pathlib import Path, PurePosixPath
          from PIL import Image, ImageDraw, ImageFont
          import xml.etree.ElementTree as ET
          import cairosvg
          from io import BytesIO

          root = Path.cwd()
          out = root / "output" / "reference-zip-audit"
          out.mkdir(parents=True, exist_ok=True)
          names = [
              "workout-guide-pull-up-reference.zip",
              "workout-guide-pull-up-reference-1.zip",
          ]
          combined = {}
          image_records = []
          for archive_name in names:
              archive = root / archive_name
              if not archive.is_file():
                  raise SystemExit(f"Expected uploaded archive is missing: {archive_name}")
              payload = archive.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              safe_dir = out / archive.stem
              safe_dir.mkdir(parents=True, exist_ok=True)
              entries = []
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC test failed: {archive_name}: {bad}")
                  for info in zf.infolist():
                      p = PurePosixPath(info.filename)
                      is_safe = not p.is_absolute() and ".." not in p.parts and not info.is_dir()
                      rec = {
                          "path": info.filename,
                          "size_bytes": info.file_size,
                          "compressed_bytes": info.compress_size,
                          "extension": p.suffix.lower(),
                          "safe_path": is_safe,
                      }
                      if not is_safe:
                          entries.append(rec)
                          continue
                      data = zf.read(info)
                      rec["sha256"] = hashlib.sha256(data).hexdigest()
                      dest = safe_dir.joinpath(*p.parts)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      ext = p.suffix.lower()
                      if ext == ".svg":
                          try:
                              svg_root = ET.fromstring(data)
                              rec["svg_root"] = svg_root.tag.split("}")[-1]
                              rec["svg_width"] = svg_root.attrib.get("width")
                              rec["svg_height"] = svg_root.attrib.get("height")
                              png = cairosvg.svg2png(bytestring=data, output_width=256, output_height=256)
                              im = Image.open(BytesIO(png)).convert("RGBA")
                              image_records.append((archive_name, info.filename, im))
                          except Exception as e:
                              rec["preview_error"] = str(e)[:200]
                      elif ext in {".png", ".jpg", ".jpeg", ".webp", ".gif"}:
                          try:
                              im = Image.open(BytesIO(data)).convert("RGBA")
                              rec["image_width"], rec["image_height"] = im.size
                              if im.width > 0 and im.height > 0:
                                  im.thumbnail((256, 256))
                                  image_records.append((archive_name, info.filename, im.copy()))
                          except Exception as e:
                              rec["preview_error"] = str(e)[:200]
                      entries.append(rec)
              entries.sort(key=lambda x: x["path"].lower())
              combined[archive_name] = {
                  "archive_bytes": len(payload),
                  "archive_sha256": digest,
                  "entry_count": len(entries),
                  "entry_count_by_extension": {},
                  "entries": entries,
              }
              for entry in entries:
                  ext = entry["extension"] or "[no extension]"
                  combined[archive_name]["entry_count_by_extension"][ext] = combined[archive_name]["entry_count_by_extension"].get(ext, 0) + 1

          first, second = [combined[n] for n in names]
          by_path = {}
          for archive_name in names:
              for entry in combined[archive_name]["entries"]:
                  by_path.setdefault(entry["path"], {})[archive_name] = entry.get("sha256")
          combined["comparison"] = {
              "same_archive_hash": first["archive_sha256"] == second["archive_sha256"],
              "same_path_count": sum(1 for v in by_path.values() if len(v) == 2),
              "identical_same_path_count": sum(1 for v in by_path.values() if len(v) == 2 and len(set(v.values())) == 1),
              "shared_paths": sorted(k for k,v in by_path.items() if len(v) == 2),
              "model_assets_found": [
                  {"archive": n, "path": e["path"], "size_bytes": e["size_bytes"]}
                  for n in names for e in combined[n]["entries"]
                  if e["extension"] in {".fbx", ".glb", ".gltf", ".blend", ".obj", ".dae", ".bvh"}
              ],
          }
          (out / "manifest.json").write_text(json.dumps(combined, indent=2) + "\n", encoding="utf-8")

          # Readable text report
          lines = ["# Uploaded Workout Guide ZIP audit", ""]
          for n in names:
              item = combined[n]
              lines += [f"## {n}", f"- Archive size: {item['archive_bytes']:,} bytes",
                        f"- SHA-256: `{item['archive_sha256']}`", f"- Entries: {item['entry_count']}",
                        f"- Extensions: {json.dumps(item['entry_count_by_extension'], sort_keys=True)}", ""]
              for e in item["entries"]:
                  lines.append(f"- `{e['path']}` — {e['size_bytes']} bytes" +
                               (f"; SHA-256 `{e['sha256']}`" if e.get("sha256") else ""))
              lines.append("")
          lines += ["## Similarity", json.dumps(combined["comparison"], indent=2), ""]
          (out / "REPORT.md").write_text("\n".join(lines), encoding="utf-8")

          if image_records:
              cols, cell_w, cell_h, margin, label_h = 3, 300, 330, 20, 50
              rows = (len(image_records) + cols - 1) // cols
              sheet = Image.new("RGB", (margin*2 + cols*cell_w, margin*2 + rows*cell_h), (17,22,28))
              draw = ImageDraw.Draw(sheet)
              try: font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 13)
              except OSError: font = ImageFont.load_default()
              for i, (archive_name, path, image) in enumerate(image_records):
                  x = margin + (i % cols)*cell_w
                  y = margin + (i // cols)*cell_h
                  draw.rounded_rectangle((x,y,x+cell_w-10,y+cell_h-10), radius=10, fill=(28,35,43))
                  label = f"{archive_name}: {path}"
                  draw.text((x+8,y+8), label[:42], fill=(200,235,215), font=font)
                  image.thumbnail((cell_w-24, cell_h-label_h-20))
                  bg = Image.new("RGBA", image.size, (28,35,43,255))
                  bg.alpha_composite(image)
                  sheet.paste(bg.convert("RGB"), (x+(cell_w-image.width)//2, y+label_h))
              sheet.save(out / "contact-sheet.jpg", quality=90)
              print(f"Contact sheet contains {len(image_records)} rendered image entries.")
          else:
              print("No raster or SVG images found for contact sheet.")
          print("Archive SHA-256 and file listings written to output/reference-zip-audit/manifest.json")
          print("Model assets detected:", len(combined["comparison"]["model_assets_found"]))
          PY

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: pull-up-reference-zip-audit
          path: output/reference-zip-audit/
          if-no-files-found: error
          retention-days: 14
