name: Deploy FitPulse MCP

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deployment is being run
        required: false
        default: Manual deployment after review

permissions:
  contents: read

concurrency:
  group: deploy-fitpulse-mcp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}
      FITPULSE_GITHUB_TOKEN: ${{ secrets.FITPULSE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check branch and required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deployments are allowed only from main."
            exit 1
          fi
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN MCP_BEARER_TOKEN FITPULSE_GITHUB_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run typecheck
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Configure runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MCP_BEARER_TOKEN" | npx wrangler secret put MCP_BEARER_TOKEN --name godot-mcp
          printf '%s' "$FITPULSE_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --name godot-mcp
      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://godot-mcp.simaklaw-vl.workers.dev/health"
          healthy=false
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "$url" -o /tmp/worker-health.json; then
              healthy=true
              break
            fi
            sleep 3
          done
          if [[ "$healthy" != "true" ]]; then
            echo "::error::Worker health endpoint did not respond successfully."
            exit 1
          fi
          node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const v=JSON.parse(s);if(v.ok!==true)process.exit(1);console.log("Worker health check passed.")}catch{process.exit(1)}})' < /tmp/worker-health.json
