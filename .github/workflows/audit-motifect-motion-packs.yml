name: Audit Motifect Motion Packs

on:
  push:
    branches:
      - audit/motifect-motion-packs
    paths:
      - "motifect_sports_and_athletics_v1_0_fbx.zip"
      - "motifect_martial_arts_v1_0_fbx.zip"
      - "tools/audit_motifect_archives.py"
      - "tools/audit_motifect_blender.py"
      - ".github/workflows/audit-motifect-motion-packs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo including the provided archives
        uses: actions/checkout@v4
      - name: Inventory and extract FBX/BVH motion data into temporary build output
        run: python3 tools/audit_motifect_archives.py --root . --out build/motifect-audit
      - name: Install Blender for headless FBX import checks
        shell: bash
        run: |
          set -euo pipefail
          version="4.5.11"
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-$version-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar xJf /tmp/blender.tar.xz -C "$HOME"
          mv "$HOME/blender-$version-linux-x64" "$HOME/blender"
          "$HOME/blender/blender" --version
      - name: Import every FBX and audit skeleton/action metadata
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/blender/blender" -b --python-exit-code 1 --python tools/audit_motifect_blender.py -- \
            build/motifect-audit/extracted/sports \
            build/motifect-audit/extracted/martial_arts \
            build/motifect-audit/blender-report.json
      - name: Publish inventory report artifact
        uses: actions/upload-artifact@v4
        with:
          name: motifect-motion-pack-audit
          path: |
            build/motifect-audit/inventory.md
            build/motifect-audit/inventory.json
            build/motifect-audit/blender-report.json
          if-no-files-found: error
          retention-days: 14
