name: Build Push-Up Animation Prototype

on:
  push:
    branches:
      - main
    paths:
      - "animation-pipeline/exercises/push_up.json"
      - "animation-pipeline/scripts/patch_opengym3d_pushup.py"
      - ".github/workflows/push-up-prototype.yml"
  pull_request:
    branches:
      - main
    paths:
      - "animation-pipeline/exercises/push_up.json"
      - "animation-pipeline/scripts/patch_opengym3d_pushup.py"
      - ".github/workflows/push-up-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-up-prototype-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate motion spec
        run: |
          python3 -m json.tool animation-pipeline/exercises/push_up.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path("animation-pipeline/exercises/push_up.json").read_text())
          assert spec["id"] == "push_up"
          assert spec.get("movement", {}).get("pattern") == "horizontal_push", "catalog movement pattern must remain horizontal_push"
          assert spec.get("keyframes"), "hand-authored keyframes are required"
          times = [f["t"] for f in spec["keyframes"]]
          assert times == sorted(times) and times[0] == 0.0 and times[-1] == 1.0
          assert len(times) >= 4
          for frame in spec["keyframes"]:
              assert "pelvis" in frame["bones"]
              assert "upper_arm.*" in frame["bones"]
              assert "forearm.*" in frame["bones"]
          assert spec.get("mocap", "").endswith("#Pushup"), "CC0 Pushup motion clip is required"
          assert spec.get("camera") == "side", "side view required to inspect push-up body line"
          assert spec.get("fps") == 30, "FitPulse output timeline must be 30 fps"
          assert abs(float(spec.get("duration", 0)) - 3.2) < 0.01, "push-up cycle must match catalog duration of 3.2 s"
          print(f"Push-up spec valid: {len(times)} fallback keyframes, 3.2 s / 30 fps target, motion capture clip wired.")
          PY

  render:
    needs: validate-spec
    strategy:
      fail-fast: false
      matrix:
        gender: [male, female]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BLENDER_VERSION: "4.5.11"
      FITX_ECORCHE: "0"
    steps:
      - name: Checkout FitPulse prototype spec
        uses: actions/checkout@v4

      - name: Checkout pinned OpenGym3D render pipeline
        uses: actions/checkout@v4
        with:
          repository: AssiamahS/opengym3d
          ref: ea3a60130fdcfb3c4771e44d09f84ebab4ee9bae
          path: upstream

      - name: Install runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          # ffmpeg/unzip are normally preinstalled on hosted runners; only install
          # what is missing. Retry transient apt mirror/lock delays rather than
          # failing one gender render before Blender starts.
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          for package in libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6; do
            dpkg-query -W -f='\u0024{Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || missing+=("$package")
          done
          if (("${#missing[@]}" > 0)); then
            echo "Installing missing runtime packages: ${missing[*]}"
            sudo apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 -o DPkg::Lock::Timeout=180 \
              install -y --no-install-recommends "${missing[@]}"
          else
            echo "All required runtime packages are already available."
          fi
          command -v ffmpeg
          command -v unzip
          ldconfig -p | grep -E 'libXi.so.6|libGL.so.1|libxkbcommon.so.0'

      - name: Cache MakeHuman athletic clothing assets
        id: makehuman-assets
        uses: actions/cache@v4
        with:
          path: third_party/makehuman-clothing
          key: makehuman-clothing-pants01-shirts03-v1-${{ runner.os }}-${{ matrix.gender }}

      - name: Download and verify CC0 shorts and CC-BY athletic tank tops
        if: steps.makehuman-assets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="third_party/makehuman-clothing"
          mkdir -p "$root"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            "https://files2.makehumancommunity.org/asset_packs/pants01/pants01_cc0.zip" \
            -o /tmp/pants01_cc0.zip
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            "https://files2.makehumancommunity.org/asset_packs/shirts03/shirts03_ccby.zip" \
            -o /tmp/shirts03_ccby.zip
          unzip -tq /tmp/pants01_cc0.zip
          unzip -tq /tmp/shirts03_ccby.zip
          unzip -oq /tmp/pants01_cc0.zip -d "$root"
          unzip -oq /tmp/shirts03_ccby.zip -d "$root"
          find "$root" -type f -name 'elvs_male_athletic_tank1.mhclo' -print -quit | grep -q .
          find "$root" -type f -name 'elvs_ladies_tank1.mhclo' -print -quit | grep -q .
          find "$root" -type f -name 'cortu_jeans_shorts.mhclo' -print -quit | grep -q .
          touch "$root/.complete"
          echo "MakeHuman apparel ready: male/female athletic tanks (CC-BY) and shorts (CC0)."

      - name: Verify cached apparel contents
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/makehuman-clothing/.complete
          find third_party/makehuman-clothing -type f -name 'elvs_male_athletic_tank1.mhclo' -print -quit | grep -q .
          find third_party/makehuman-clothing -type f -name 'elvs_ladies_tank1.mhclo' -print -quit | grep -q .
          find third_party/makehuman-clothing -type f -name 'cortu_jeans_shorts.mhclo' -print -quit | grep -q .

      - name: Cache MakeHuman CC0 hair assets
        id: makehuman-hair-assets
        uses: actions/cache@v4
        with:
          path: third_party/makehuman-hair01
          key: makehuman-hair01-cc0-v1-${{ runner.os }}

      - name: Download and verify MakeHuman CC0 hair pack
        if: steps.makehuman-hair-assets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="third_party/makehuman-hair01"
          mkdir -p "$root"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "https://files2.makehumancommunity.org/asset_packs/hair01/hair01_cc0.zip" \
            -o /tmp/hair01_cc0.zip
          unzip -tq /tmp/hair01_cc0.zip
          unzip -oq /tmp/hair01_cc0.zip -d "$root"
          find "$root" -type f -name 'cortu_short_messy_hair.mhclo' -print -quit | grep -q .
          find "$root" -type f -name 'elvs_reverse_french_braid_bun.mhclo' -print -quit | grep -q .
          touch "$root/.complete"
          echo "MakeHuman CC0 Hair 01 ready: short male hair and female braided bun found."

      - name: Verify cached hairstyle contents
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/makehuman-hair01/.complete
          find third_party/makehuman-hair01 -type f -name 'cortu_short_messy_hair.mhclo' -print -quit | grep -q .
          find third_party/makehuman-hair01 -type f -name 'elvs_reverse_french_braid_bun.mhclo' -print -quit | grep -q .

      - name: Cache MakeHuman CC-BY running shoe assets
        id: makehuman-shoes-assets
        uses: actions/cache@v4
        with:
          path: third_party/makehuman-shoes02
          key: makehuman-shoes02-ccby-punkduck-running-shoes-v1-${{ runner.os }}

      - name: Download and verify MakeHuman running shoes
        if: steps.makehuman-shoes-assets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="third_party/makehuman-shoes02"
          mkdir -p "$root"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "https://files2.makehumancommunity.org/asset_packs/shoes02/shoes02_ccby.zip" \
            -o /tmp/shoes02_ccby.zip
          unzip -tq /tmp/shoes02_ccby.zip
          unzip -oq /tmp/shoes02_ccby.zip -d "$root"
          find "$root" -type f -name 'punkduck_running_shoes_01.mhclo' -print -quit | grep -q .
          touch "$root/.complete"
          echo "MakeHuman CC-BY Shoes 02 ready: Punkduck running-shoes mesh found."

      - name: Verify cached running-shoe asset
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/makehuman-shoes02/.complete
          find third_party/makehuman-shoes02 -type f -name 'punkduck_running_shoes_01.mhclo' -print -quit | grep -q .

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar xJf /tmp/blender.tar.xz -C "$HOME"
          mv "$HOME/blender-${BLENDER_VERSION}-linux-x64" "$HOME/blender"

      - name: Patch FitPulse character/apparel renderer and push-up-specific motion QA
        run: python3 ../animation-pipeline/scripts/patch_opengym3d_pushup.py
        working-directory: upstream

      - name: Render ${{ matrix.gender }} GLB and transparent sequences
        shell: bash
        run: |
          set -euo pipefail
          gender="${{ matrix.gender }}"
          mkdir -p "../output/$gender"
          FITX_GENDER="$gender" FITX_ECORCHE=0 FITX_APPAREL_ROOT="$GITHUB_WORKSPACE/third_party/makehuman-clothing" FITX_HAIR_ROOT="$GITHUB_WORKSPACE/third_party/makehuman-hair01" FITX_SHOES_ROOT="$GITHUB_WORKSPACE/third_party/makehuman-shoes02" \
            "$HOME/blender/blender" -b -noaudio --python-exit-code 1 -P pipeline/build_exercise.py -- \
            ../animation-pipeline/exercises/push_up.json "../output/$gender" 2>&1 | tee "../output/$gender/build.log"
          test -s "../output/$gender/push_up.glb"
          test -s "../output/$gender/push_up.png"
          grep -q "CHARACTER_PROFILE_VERIFIED gender=$gender" "../output/$gender/build.log"
          if [ "$gender" = "male" ]; then
            shirt_asset="elvs_male_athletic_tank1.mhclo"
          else
            shirt_asset="elvs_ladies_tank1.mhclo"
          fi
          grep -q "APPAREL_LOADED gender=$gender item=shirt asset=$shirt_asset" "../output/$gender/build.log"
          grep -q "APPAREL_LOADED gender=$gender item=shorts" "../output/$gender/build.log"
          grep -q "APPAREL_LOADED gender=$gender item=hair" "../output/$gender/build.log"
          grep -q "APPAREL_LOADED gender=$gender item=shoes" "../output/$gender/build.log"
        working-directory: upstream

      - name: Run upstream joint-integrity QA
        shell: bash
        run: |
          set -euo pipefail
          gender="${{ matrix.gender }}"
          python3 pipeline/qa_glb.py "../output/$gender/push_up.glb" 2>&1 | tee "../output/$gender/qa.log"
          grep -q "PUSHUP_QA PASS" "../output/$gender/build.log"
          grep -q "PUSHUP_RETIME PASS" "../output/$gender/build.log"
          grep -q "MOCAP cc0/mesh2motion/human-addon-animations.glb#Pushup" "../output/$gender/build.log"
          python3 - "$gender" <<'PY'
          import json
          import sys
          from pathlib import Path

          gender = sys.argv[1]
          report = json.loads((Path("../output") / gender / "push_up.glb.qa.json").read_text())
          duration = float(report["duration"])
          assert report["summary"]["pass"], f"{gender}: joint QA did not pass"
          assert abs(duration - 3.2) <= 0.05, f"{gender}: GLB duration {duration:.3f}s, expected 3.2s"
          print(f"TIMING_QA PASS gender={gender} glb_duration={duration:.3f}s target=3.200s")
          PY
        working-directory: upstream

      - name: Verify apparel meshes are embedded in the GLB
        shell: bash
        run: |
          set -euo pipefail
          gender="${{ matrix.gender }}"
          python3 - "$gender" <<'PY'
          from pathlib import Path
          import json
          import struct
          import sys

          gender = sys.argv[1]
          shirt_token = "elvs_male_athletic_tank1" if gender == "male" else "elvs_ladies_tank1"
          hair_token = "cortu_short_messy_hair" if gender == "male" else "elvs_reverse_french_braid_bun"
          shoes_token = "punkduck_running_shoes_01"
          data = (Path("output") / gender / "push_up.glb").read_bytes()
          assert data[:4] == b"glTF", f"{gender}: invalid GLB header"
          json_length = struct.unpack_from("<I", data, 12)[0]
          json_chunk_type = struct.unpack_from("<I", data, 16)[0]
          assert json_chunk_type == 0x4E4F534A, f"{gender}: first GLB chunk is not JSON"
          document = json.loads(data[20:20 + json_length].decode("utf-8").rstrip(" "))
          names = [node.get("name", "").lower() for node in document.get("nodes", [])]
          assert any(shirt_token in name for name in names), f"{gender}: shirt mesh is absent from GLB nodes: {names[:20]}"
          assert any("cortu_jeans_shorts" in name for name in names), f"{gender}: shorts mesh is absent from GLB nodes: {names[:20]}"
          assert any(hair_token in name for name in names), f"{gender}: hairstyle mesh {hair_token} is absent from GLB nodes: {names[:20]}"
          assert any(shoes_token in name for name in names), f"{gender}: running-shoe mesh {shoes_token} is absent from GLB nodes: {names[:20]}"
          print(f"APPAREL_GLB_PASS gender={gender} meshes={len(names)} shirt={shirt_token} shorts=cortu_jeans_shorts hair={hair_token} shoes={shoes_token}")
          PY

      - name: Assemble studio review and branded FitPulse preview
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gender="${{ matrix.gender }}"
          python3 - <<'PY'
          import math
          from pathlib import Path

          width = height = 720
          data = bytearray()
          for y in range(height):
              t = y / max(1, height - 1)
              base_r = int(12 + 4 * t)
              base_g = int(20 + 13 * t)
              base_b = int(26 + 7 * t)
              for x in range(width):
                  dx = (x - width * 0.50) / (width * 0.62)
                  dy = (y - height * 0.40) / (height * 0.72)
                  glow = max(0.0, 1.0 - math.sqrt(dx * dx + dy * dy))
                  amount = int(22 * glow * glow)
                  r = min(255, base_r + int(amount * 0.20))
                  g = min(255, base_g + int(amount * 0.90))
                  b = min(255, base_b + int(amount * 0.56))
                  if y > 130 and y % 120 < 2 and 56 < x < width - 56:
                      r, g, b = min(255, r + 1), min(255, g + 4), min(255, b + 3)
                  data.extend((r, g, b))
          Path('/tmp/fitpulse-push-up-bg.ppm').write_bytes(f'P6\n{width} {height}\n255\n'.encode() + data)
          print('Generated dark forest/mint background for transparent-frame compositing.')
          PY
          frame_dir="output/$gender/frames_push_up"
          alpha_dir="output/$gender/frames_push_up_alpha"
          frame_count="$(sed -nE 's/.*OK push_up: ([0-9]+) frames.*/\1/p' "output/$gender/build.log" | tail -n 1)"
          [[ "$frame_count" =~ ^[0-9]+$ ]] && (( frame_count >= 30 ))
          echo "EXPECTED_FRAME_COUNT=$frame_count" >> "$GITHUB_ENV"
          test "$(find "$frame_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq "$frame_count"
          test "$(find "$alpha_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq "$frame_count"
          ffmpeg -y -v error -framerate 30 -pattern_type glob -i "$frame_dir/*.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/$gender/push_up_studio.mp4"
          ffmpeg -y -v error -loop 1 -framerate 30 -i /tmp/fitpulse-push-up-bg.ppm -framerate 30 -pattern_type glob -i "$alpha_dir/*.png" -filter_complex "[0:v][1:v]overlay=shortest=1:format=auto,format=yuv420p[v]" -map "[v]" -frames:v "$frame_count" -c:v libx264 -crf 19 -preset medium -movflags +faststart "output/$gender/push_up.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 "output/$gender/push_up.mp4" | tee "output/$gender/video-qa.txt"
          grep -qx 'width=720' "output/$gender/video-qa.txt"
          grep -qx 'height=720' "output/$gender/video-qa.txt"
          grep -qx 'r_frame_rate=30/1' "output/$gender/video-qa.txt"
          grep -qx "nb_frames=$frame_count" "output/$gender/video-qa.txt"
          ffmpeg -y -v error -i "output/$gender/push_up.mp4" -vf "select='eq(n,$((frame_count / 2)))'" -vsync 0 -frames:v 1 "output/$gender/poster.png"
          test -s "output/$gender/poster.png"

      - name: Generate visual QA contact sheet
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gender="${{ matrix.gender }}"
          video="output/$gender/push_up.mp4"
          if [ ! -s "$video" ]; then
            echo "Missing MP4 for $gender; cannot create its contact sheet" >&2
            exit 1
          fi
          ffmpeg -y -v error -i "$video" -vf "fps=10/3,scale=360:360,tile=4x3" -frames:v 1 "output/$gender/push_up_contact_sheet.png"
          test -s "output/$gender/push_up_contact_sheet.png"

      - name: Verify transparent PNG sequence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gender="${{ matrix.gender }}"
          alpha_dir="output/$gender/frames_push_up_alpha"
          expected_frames="${EXPECTED_FRAME_COUNT:-0}"
          [[ "$expected_frames" =~ ^[0-9]+$ ]] && (( expected_frames >= 30 ))
          test -d "$alpha_dir"
          test "$(find "$alpha_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq "$expected_frames"
          python3 -m venv /tmp/fitpulse-alpha-qa
          /tmp/fitpulse-alpha-qa/bin/python -m pip install --quiet --disable-pip-version-check pillow
          GENDER="$gender" /tmp/fitpulse-alpha-qa/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import os

          gender = os.environ["GENDER"]
          folder = Path("output") / gender / "frames_push_up_alpha"
          frames = sorted(folder.glob("*.png"))
          expected = int(os.environ["EXPECTED_FRAME_COUNT"])
          assert len(frames) == expected, f"{gender}: expected {expected} transparent frames, got {len(frames)}"
          unique_frames = set()
          transparent_fractions = []
          for path in frames:
              with Image.open(path) as im:
                  assert im.size == (720, 720), f"{gender}/{path.name}: unexpected size {im.size}"
                  assert im.mode == "RGBA", f"{gender}/{path.name}: missing RGBA alpha channel"
                  alpha = im.getchannel("A")
                  corners = [alpha.getpixel((0, 0)), alpha.getpixel((im.width - 1, 0)), alpha.getpixel((0, im.height - 1)), alpha.getpixel((im.width - 1, im.height - 1))]
                  assert all(value == 0 for value in corners), f"{gender}/{path.name}: nontransparent corner pixels {corners}"
                  subject_bbox = alpha.getbbox()
                  assert subject_bbox is not None, f"{gender}/{path.name}: empty alpha frame"
                  left, top, right, bottom = subject_bbox
                  assert left >= 2 and top >= 2 and right <= im.width - 3 and bottom <= im.height - 3, (
                      f"{gender}/{path.name}: subject/equipment touches frame edge at {subject_bbox}; "
                      "transparent export must retain safe margins"
                  )
                  transparent_fraction = alpha.histogram()[0] / (im.width * im.height)
                  assert 0.80 <= transparent_fraction <= 0.98, f"{gender}/{path.name}: transparent fraction {transparent_fraction:.1%}; expected visible subject with clean background"
                  assert alpha.getextrema()[1] == 255, f"{gender}/{path.name}: no fully opaque subject pixels"
                  transparent_fractions.append(transparent_fraction)
                  unique_frames.add(hashlib.sha256(im.tobytes()).digest())
          assert len(unique_frames) >= max(20, int(expected * 0.80)), f"{gender}: only {len(unique_frames)} visually unique RGBA frames out of {expected}; animation may be static"
          with Image.open(Path("output") / gender / "push_up.png") as thumbnail:
              assert thumbnail.size == (512, 512), f"{gender}: unexpected thumbnail size {thumbnail.size}"
          print(f"Alpha QA PASS: {gender}, {len(frames)} frames, 720x720 RGBA; transparent corners, 80–98% transparent pixels, opaque subject, {len(unique_frames)} unique frames, min transparent fraction {min(transparent_fractions):.1%}.")
          PY

      - name: Upload per-profile animation and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-push-up-${{ matrix.gender }}
          path: output/${{ matrix.gender }}/**
          if-no-files-found: warn
          retention-days: 14

  verify-pair:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download male render artifact
        uses: actions/download-artifact@v4
        with:
          name: fitpulse-push-up-male
          path: bundle/male

      - name: Download female render artifact
        uses: actions/download-artifact@v4
        with:
          name: fitpulse-push-up-female
          path: bundle/female

      - name: Verify distinct male and female render outputs
        shell: bash
        run: |
          set -euo pipefail
          for gender in male female; do
            test -s "bundle/$gender/push_up.glb"
            test -s "bundle/$gender/push_up.png"
            test -s "bundle/$gender/push_up.mp4"
            test -s "bundle/$gender/poster.png"
            grep -q "CHARACTER_PROFILE_VERIFIED gender=$gender" "bundle/$gender/build.log"
            if [ "$gender" = "male" ]; then
              shirt_asset="elvs_male_athletic_tank1.mhclo"
            else
              shirt_asset="elvs_ladies_tank1.mhclo"
            fi
            grep -q "APPAREL_LOADED gender=$gender item=shirt asset=$shirt_asset" "bundle/$gender/build.log"
            grep -q "APPAREL_LOADED gender=$gender item=shorts" "bundle/$gender/build.log"
            grep -q "APPAREL_LOADED gender=$gender item=hair" "bundle/$gender/build.log"
            grep -q "APPAREL_LOADED gender=$gender item=shoes" "bundle/$gender/build.log"
          done
          if cmp -s bundle/male/push_up.glb bundle/female/push_up.glb; then
            echo "Male/female GLB files are byte-identical." >&2
            exit 1
          fi
          python3 -m venv /tmp/fitpulse-pair-qa
          /tmp/fitpulse-pair-qa/bin/python -m pip install --quiet --disable-pip-version-check pillow
          /tmp/fitpulse-pair-qa/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          with Image.open("bundle/male/push_up.png") as male_thumb, Image.open("bundle/female/push_up.png") as female_thumb:
              assert male_thumb.size == female_thumb.size == (512, 512)
              assert hashlib.sha256(male_thumb.tobytes()).digest() != hashlib.sha256(female_thumb.tobytes()).digest(), "male/female thumbnails are pixel-identical"
          with Image.open("bundle/male/poster.png") as male_poster, Image.open("bundle/female/poster.png") as female_poster:
              assert male_poster.size == female_poster.size == (720, 720)
              assert hashlib.sha256(male_poster.tobytes()).digest() != hashlib.sha256(female_poster.tobytes()).digest(), "male/female posters are pixel-identical"
          print("Character presentation QA PASS: both GLBs, thumbnails and posters differ across verified profiles.")
          PY

      - name: Publish combined verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-push-up-prototype
          path: bundle/**
          if-no-files-found: error
          retention-days: 14
