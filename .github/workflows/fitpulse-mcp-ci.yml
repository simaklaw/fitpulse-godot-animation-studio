name: FitPulse MCP CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/fitpulse-mcp-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/fitpulse-mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run typecheck
