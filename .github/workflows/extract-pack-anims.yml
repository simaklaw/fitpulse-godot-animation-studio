name: Extract pack animations (.scn → GLB)

# T1.1 — черновик. Godot image: barichello/godot-ci:4.7.2 (совпадает с редактором владельца).
on:
  workflow_dispatch:
    inputs:
      scn_path:
        description: "Path to .scn under assets sport/"
        required: true
        default: "assets sport/AS_Calisthenics_001_Squats.FBX-15535a030ec924b9640a07499c98abc9.scn"
      exercise_id:
        description: "Catalog exercise id (for artifact naming)"
        required: true
        default: "bodyweight_squat"

permissions:
  contents: read

concurrency:
  group: extract-pack-${{ github.ref }}-${{ inputs.exercise_id }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p out

      - name: Extract animation to GLB
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          OUT="out/${{ inputs.exercise_id }}.glb"
          godot --headless --path . \
            --script animation-pipeline/tools/extract_anim.gd \
            -- --input "${{ inputs.scn_path }}" --output "$OUT" \
            || true
          ls -la out/ || true
          if [ ! -f "$OUT" ]; then
            echo "WARN: GLB not produced — .scn may need Godot 4.7 import or F1 phone export"
            echo "See docs/AGENT_PLAN.md F1 fallback"
            exit 1
          fi
          sha256sum "$OUT" | tee "out/${{ inputs.exercise_id }}.sha256"
          # Pack GLB must not become a public Actions artifact (AGENTS.md rule 5).
          rm -f "$OUT"

      - name: Upload extract report only (no pack GLB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extract-report-${{ inputs.exercise_id }}
          path: out/${{ inputs.exercise_id }}.extract.json
          if-no-files-found: warn
          retention-days: 14

