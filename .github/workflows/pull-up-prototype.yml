name: Build Pull-Up Animation Prototype

on:
  push:
    branches:
      - feat/pull-up-animation-prototype
      - fix/pull-up-render-quality
      - fix/pull-up-prototype-clean-main
      - feat/pull-up-transparent-export
    paths:
      - "animation-pipeline/**"
      - ".github/workflows/pull-up-prototype.yml"
  pull_request:
    branches:
      - main
    paths:
      - "animation-pipeline/**"
      - ".github/workflows/pull-up-prototype.yml"

permissions:
  contents: read

concurrency:
  group: pull-up-prototype-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate motion spec
        run: |
          python3 -m json.tool animation-pipeline/exercises/pull_up.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path("animation-pipeline/exercises/pull_up.json").read_text())
          assert spec["id"] == "pull_up"
          assert spec.get("movement", {}).get("pattern") == "pull_up"
          assert spec.get("keyframes"), "hand-authored keyframes are required"
          times = [f["t"] for f in spec["keyframes"]]
          assert times == sorted(times) and times[0] == 0.0 and times[-1] == 1.0
          assert len(times) >= 5
          for frame in spec["keyframes"]:
              assert "pelvis" in frame["bones"]
              assert "upper_arm.*" in frame["bones"]
              assert "forearm.*" in frame["bones"]
          print(f"Motion spec valid: {len(times)} keyframes, normalized 0..1.")
          PY

  render:
    needs: validate-spec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLENDER_VERSION: "4.5.11"
      FITX_ECORCHE: "0"
    steps:
      - name: Checkout FitPulse prototype spec
        uses: actions/checkout@v4

      - name: Checkout pinned OpenGym3D render pipeline
        uses: actions/checkout@v4
        with:
          repository: AssiamahS/opengym3d
          ref: ea3a60130fdcfb3c4771e44d09f84ebab4ee9bae
          path: upstream

      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 ffmpeg

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar xJf /tmp/blender.tar.xz -C "$HOME"
          mv "$HOME/blender-${BLENDER_VERSION}-linux-x64" "$HOME/blender"

      - name: Patch upstream renderer for a fixed pull-up rack
        run: python3 ../animation-pipeline/scripts/patch_opengym3d_pullup.py
        working-directory: upstream

      - name: Render GLB and thumbnail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../output
          FITX_ECORCHE=0 "$HOME/blender/blender" -b -noaudio --python-exit-code 1 -P pipeline/build_exercise.py -- ../animation-pipeline/exercises/pull_up.json ../output 2>&1 | tee ../output/build.log
          test -s ../output/pull_up.glb
          test -s ../output/pull_up.png
        working-directory: upstream

      - name: Run upstream joint-integrity QA
        shell: bash
        run: |
          set -o pipefail
          python3 pipeline/qa_glb.py ../output/pull_up.glb 2>&1 | tee ../output/qa.log
        working-directory: upstream

      - name: Assemble MP4 preview
        if: always()
        shell: bash
        run: |
          if compgen -G "output/frames_pull_up/*.png" > /dev/null; then
            ffmpeg -y -v error -framerate 30 -pattern_type glob -i 'output/frames_pull_up/*.png' -c:v libx264 -pix_fmt yuv420p -movflags +faststart output/pull_up.mp4
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 output/pull_up.mp4 | tee output/video-qa.txt
            grep -qx 'width=720' output/video-qa.txt
            grep -qx 'height=720' output/video-qa.txt
            grep -qx 'r_frame_rate=30/1' output/video-qa.txt
            grep -qx 'nb_frames=72' output/video-qa.txt
          fi

      - name: Generate visual QA contact sheet
        if: always()
        shell: bash
        run: |
          if [ -s output/pull_up.mp4 ]; then
            ffmpeg -y -v error -i output/pull_up.mp4 -vf "fps=10/3,scale=360:360,tile=4x2" -frames:v 1 output/pull_up_contact_sheet.png
            test -s output/pull_up_contact_sheet.png
          fi

      - name: Verify transparent frame sequence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "output/frames_pull_up_alpha/*.png" > /dev/null; then
            python3 -m venv /tmp/fitpulse-alpha-qa
            /tmp/fitpulse-alpha-qa/bin/python -m pip install --quiet --disable-pip-version-check pillow
            /tmp/fitpulse-alpha-qa/bin/python - <<'PY'
            from pathlib import Path
            from PIL import Image
            frames = sorted(Path("output/frames_pull_up_alpha").glob("*.png"))
            assert len(frames) == 72, f"expected 72 transparent frames, got {len(frames)}"
            saw_transparent = False
            saw_opaque = False
            for path in frames:
                with Image.open(path) as im:
                    assert im.size == (720, 720), f"{path.name}: unexpected size {im.size}"
                    assert im.mode == "RGBA", f"{path.name}: missing RGBA alpha channel"
                    alpha = im.getchannel("A")
                    lo, hi = alpha.getextrema()
                    corners = [
                        alpha.getpixel((0, 0)),
                        alpha.getpixel((im.width - 1, 0)),
                        alpha.getpixel((0, im.height - 1)),
                        alpha.getpixel((im.width - 1, im.height - 1)),
                    ]
                    assert all(value == 0 for value in corners), (
                        f"{path.name}: expected transparent corners, got {corners}"
                    )
                    transparent_fraction = sum(value == 0 for value in alpha.getdata()) / (im.width * im.height)
                    assert transparent_fraction >= 0.05, (
                        f"{path.name}: only {transparent_fraction:.1%} fully transparent pixels; matte may remain"
                    )
                    saw_transparent |= lo == 0
                    saw_opaque |= hi == 255
            assert saw_transparent, "no fully transparent pixels detected; background may still be present"
            assert saw_opaque, "no opaque subject pixels detected"
            print(f"Alpha QA PASS: {len(frames)} RGBA frames at 720x720; transparent corners, clear background and opaque subject verified.")
            PY
          else
            echo "Transparent frame sequence missing" >&2
            exit 1
          fi

      - name: Upload animation and QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-pull-up-prototype
          path: |
            output/pull_up.glb
            output/pull_up.png
            output/pull_up.mp4
            output/pull_up_contact_sheet.png
            output/frames_pull_up_alpha/*.png
            output/pull_up.glb.qa.json
            output/build.log
            output/qa.log
            output/video-qa.txt
          if-no-files-found: warn
          retention-days: 14
