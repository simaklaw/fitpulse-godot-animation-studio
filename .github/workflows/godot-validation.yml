name: Godot Project Validation

on:
  push:
    branches: [main]
    paths:
      - "godot-studio/**"
      - ".github/workflows/godot-validation.yml"
  pull_request:
    paths:
      - "godot-studio/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for validation
        required: false
        default: Manual validation
  repository_dispatch:
    types: [fitpulse_godot_validate]

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.5"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${VERSION}-stable_linux.x86_64
          ln -sf "/tmp/godot/Godot_v${VERSION}-stable_linux.x86_64" /tmp/godot/godot
      - name: Validate Godot project and main scene
        shell: bash
        run: |
          set -euo pipefail
          test -f "godot-studio/project.godot"
          LOG="/tmp/godot-validation.log"
          /tmp/godot/godot --headless --path godot-studio --editor --quit --verbose 2>&1 | tee "$LOG"
          /tmp/godot/godot --headless --path godot-studio --quit-after 2 res://scenes/animation_studio.tscn 2>&1 | tee -a "$LOG"
          if grep -E '(^ERROR:|^SCRIPT ERROR:|Parse Error)' "$LOG"; then
            echo "::error::Godot reported a parse or runtime error."
            exit 1
          fi
          echo "Godot project import and main-scene load completed without reported errors."
